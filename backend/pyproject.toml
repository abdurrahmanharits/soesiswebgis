[project]
name = "soesis-backend"
version = "0.1.0"
description = "SoESIS WebGIS backend (FastAPI): datasets, spatial ingestion, preview, curation, catalogue."
readme = "README.md"
# Python of the official OSGeo GDAL 3.10 image (Ubuntu 24.04), so osgeo.gdal bindings match libgdal.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.16",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "celery[redis]>=5.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "import-linter>=2.1",
    "ruff>=0.8",
]

[tool.uv]
# Application, not a distributable package: code runs from src/ (PYTHONPATH).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: needs the soesis_pytest PostGIS database and Redis",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# ---- Architecture rules (checked by `lint-imports`, also run in tests/architecture) ----
[tool.importlinter]
root_package = "soesis"
include_external_packages = true

# Every module: api and infrastructure (adapters) sit on application (use cases + ports),
# which sits on domain. api never imports infrastructure; wiring happens in soesis.main.
[[tool.importlinter.contracts]]
name = "Module layers: api | infrastructure -> application -> domain"
type = "layers"
containers = ["soesis.modules.system"]
layers = ["api | infrastructure", "application", "domain"]

# The core stays framework- and database-free.
[[tool.importlinter.contracts]]
name = "Domain and application layers are framework-free"
type = "forbidden"
source_modules = [
    "soesis.modules.*.domain",
    "soesis.modules.*.application",
    "soesis.spatial",
]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "sqlalchemy", "geoalchemy2", "psycopg",
    "alembic", "celery", "redis", "osgeo", "soesis.shared.db",
]

# The shared kernel and the spatial library never depend on feature modules.
[[tool.importlinter.contracts]]
name = "shared and spatial do not depend on modules"
type = "forbidden"
source_modules = ["soesis.shared", "soesis.spatial"]
forbidden_modules = ["soesis.modules", "soesis.main", "soesis.worker"]
