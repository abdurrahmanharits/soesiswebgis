name: soesis_poc

services:
  app:
    build:
      context: ./docker/php

    image: soesis-poc-php:local
    init: true
    restart: unless-stopped

    working_dir: /var/www/html

    # Set here rather than only in api/.env: once `php artisan optimize` caches the
    # config, Laravel no longer loads .env and artisan serve would fall back to 1 worker.
    environment:
      PHP_CLI_SERVER_WORKERS: "4"

    volumes:
      - ./api:/var/www/html

    ports:
      - "127.0.0.1:8000:8000"

    command:
      - php
      - artisan
      - serve
      - "--host=0.0.0.0"
      - "--port=8000"
      # Required for PHP_CLI_SERVER_WORKERS (.env) to take effect.
      - "--no-reload"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped

    environment:
      POSTGRES_DB: soesis
      POSTGRES_USER: soesis
      POSTGRES_PASSWORD: "soesis_dev_2026"

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "soesis", "-d", "soesis"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Reachable from the host for the backend run with `uv` outside Docker (localhost only).
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

    command:
      - redis-server
      - "--appendonly"
      - "yes"
      - "--maxmemory-policy"
      - "noeviction"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ---- Rewrite (branch rewrite/nextjs-fastapi): FastAPI backend + Celery worker ----
  # Laravel (app, worker) keeps running on :8000 as the behaviour reference until R7.

  backend:
    build:
      context: ./backend
    image: soesis-backend:local
    init: true
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Reload by polling, limited to src/ (inotify does not cross the Windows bind mount).
      WATCHFILES_FORCE_POLLING: "true"
      SOESIS_CONTRACT_PATH: /contracts/openapi.json
    command:
      - uvicorn
      - soesis.main:app
      - "--host=0.0.0.0"
      - "--port=8001"
      - "--reload"
      - "--reload-dir=/app/src"
      # Only the Next.js proxy reaches this port (bound to 127.0.0.1): trust its X-Forwarded-For
      # so login throttling sees the browser IP.
      - "--proxy-headers"
      - "--forwarded-allow-ips=*"
    volumes:
      - ./backend:/app
      - ./contracts:/contracts
      # Shared with Laravel during the rewrite (decision 22).
      - ./api/storage/app/private:/data/storage
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend-worker:
    image: soesis-backend:local
    init: true
    restart: unless-stopped
    env_file: ./backend/.env
    command:
      - celery
      - "--app=soesis.worker"
      - worker
      - "--queues=spatial"
      - "--concurrency=2"
      - "--loglevel=INFO"
    volumes:
      - ./backend:/app
      - ./api/storage/app/private:/data/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: